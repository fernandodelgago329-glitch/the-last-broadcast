<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Last Broadcast</title>
<style>
:root{--bg:#0b1020;--panel:#151d35;--line:#2a385d;--text:#eef3ff;--muted:#9aa8c9;--cyan:#62e6ff;--red:#ff6b88;--gold:#ffd166;--green:#6ee7a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1a2850,#0b1020 55%);font:15px system-ui,sans-serif;color:var(--text);min-height:100vh}main{max-width:980px;margin:auto;padding:28px 18px}h1{font-size:clamp(32px,6vw,58px);margin:0 0 6px;letter-spacing:-2px}h2{margin-top:0}.sub{color:var(--muted);margin:0 0 26px}.card{background:rgba(21,29,53,.92);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 12px 35px #0003}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#0e162b;color:var(--text);font-size:16px;margin:7px 0 12px}button{border:0;border-radius:10px;padding:12px 15px;background:var(--cyan);color:#06121c;font-weight:750;cursor:pointer;margin:4px}button.secondary{background:#2a385d;color:var(--text)}button.warn{background:var(--red);color:#220711}button.gold{background:var(--gold)}button:disabled{opacity:.38;cursor:not-allowed}.room{font-size:30px;letter-spacing:6px;color:var(--cyan);font-weight:800}.bar{height:17px;background:#0d1427;border-radius:99px;overflow:hidden;border:1px solid var(--line)}.fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));transition:width .3s}.danger .fill{background:linear-gradient(90deg,var(--gold),var(--red))}.stat{display:flex;justify-content:space-between;color:var(--muted);margin:8px 0 5px}.players{display:grid;gap:8px}.player{display:flex;justify-content:space-between;padding:10px 12px;background:#0d1427;border-radius:10px}.dead{opacity:.45;text-decoration:line-through}.pill{padding:4px 8px;border-radius:99px;background:#26365d;color:var(--muted);font-size:12px}.log{max-height:220px;overflow:auto;color:var(--muted);font-size:13px}.log div{padding:7px 0;border-bottom:1px solid #ffffff0b}.notice{padding:12px;border-radius:10px;background:#1d2b4c;margin:10px 0}.dangerbox{background:#3c1d35}.hidden{display:none!important}.role-sab{color:var(--red)}.role-op{color:var(--green)}.small{font-size:12px;color:var(--muted)}.station-map{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}.room-card{background:#0d1427;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;cursor:pointer;transition:.15s}.room-card:hover,.room-card.active{border-color:var(--cyan);transform:translateY(-2px)}.room-card.fault{border-color:var(--red);box-shadow:0 0 18px #ff6b8830}.room-card b{display:block;font-size:17px;text-transform:capitalize}.room-card span{font-size:12px;color:var(--muted)}.crew-dot{display:inline-block;background:var(--green);color:#092013;border-radius:99px;padding:2px 6px;font-size:11px;margin:3px 2px 0 0}.challenge{background:#0d1427;border:1px solid var(--cyan);border-radius:14px;padding:16px;margin:14px 0}.symbols{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.symbols button{font-size:22px;min-width:48px}.sequence{letter-spacing:7px;font-size:23px;color:var(--gold)}.modal{position:fixed;inset:0;background:#050817bb;display:grid;place-items:center;padding:20px;z-index:10}.modal-box{width:min(420px,100%);background:var(--panel);border:1px solid var(--cyan);border-radius:18px;padding:26px;text-align:center;box-shadow:0 20px 70px #0009}
</style></head>
<body><main><h1>THE LAST BROADCAST</h1><p class="sub">A live social-deduction game for 2–8 players.</p>
<section id="home" class="card"><div class="grid"><div><h2>Create a room</h2><input id="createName" placeholder="Your name" maxlength="18"><button onclick="createRoom()">Create room</button></div><div><h2>Join a room</h2><input id="joinName" placeholder="Your name" maxlength="18"><input id="joinCode" placeholder="Room code" maxlength="6"><button onclick="joinRoom()">Join room</button></div></div><p id="error" class="notice hidden"></p></section>
<section id="game" class="hidden"><div class="card" id="top"></div><div class="grid" style="margin-top:16px"><div class="card" id="controls"></div><div class="card"><h2>Crew manifest</h2><div id="players" class="players"></div><h2 style="margin-top:22px">Event log</h2><div id="log" class="log"></div></div></div></section></main>
<script>
let room=location.hash.slice(1),playerId=sessionStorage.getItem('playerId'),state=null,challenge=null;
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function err(s){$('error').textContent=s;$('error').classList.remove('hidden')}function hideErr(){$('error').classList.add('hidden')}
async function api(path,data){const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
async function createRoom(){try{hideErr();enter(await api('create',{name:$('createName').value||'Host'}))}catch(e){err(e.message)}}
async function joinRoom(){try{hideErr();enter(await api('join',{name:$('joinName').value||'Player',room:$('joinCode').value}))}catch(e){err(e.message)}}
function enter(j){room=j.room;playerId=j.playerId;sessionStorage.setItem('playerId',playerId);location.hash=room;$('home').classList.add('hidden');$('game').classList.remove('hidden');poll()}
async function act(name,extra={}){try{const result=await api(name,{room,playerId,...extra});if(result.ended){sessionStorage.removeItem('playerId');location.hash='';location.reload();return}state=result;render()}catch(e){alert(e.message)}}
async function poll(){if(!room||!playerId)return;try{const r=await fetch(`/api/state?room=${room}&playerId=${playerId}`);if(r.ok){state=await r.json();$('home').classList.add('hidden');$('game').classList.remove('hidden');render()}}catch{}setTimeout(poll,700)}
const names={control:'Control Room',reactor:'Reactor Core',archive:'Archive Vault',comms:'Comms Array'};const icons={control:'◈',reactor:'⚡',archive:'▤',comms:'⌁'};
function startChallenge(){if(!state.you.alive)return;const symbols=['◆','●','▲','■','✦'];challenge={room:state.you.room,sequence:[...symbols].sort(()=>Math.random()-.5).slice(0,3),step:0};render()}
function pickSymbol(symbol){if(!challenge)return;if(symbol===challenge.sequence[challenge.step]){challenge.step++;if(challenge.step===challenge.sequence.length){const target=challenge.room;challenge=null;act('task',{room:target})}else render()}else{challenge.step=0;render()}}
function roomButtons(s,me){return s.rooms.map(r=>{const crew=s.players.filter(p=>p.alive&&p.room===r).map(p=>`<span class="crew-dot">${esc(p.name.slice(0,8))}</span>`).join('');return `<div class="room-card ${me.room===r?'active ':''}${s.roomFaults[r]?'fault':''}" onclick="act('move',{destination:'${r}'})"><b>${icons[r]} ${names[r]}</b><span>${s.roomFaults[r]?'⚠ SYSTEM FAULT':'Stable'} · ${crew||'empty'}</span></div>`}).join('')}
function render(){const s=state,me=s.you,host=s.hostId===me.id,phase=s.phase==='lobby'?'LOBBY':s.phase==='meeting'?'MEETING':s.phase==='ended'?'GAME OVER':'LIVE';$('top').innerHTML=`<div class="stat"><span>ROOM CODE</span><span>STATUS: ${phase}</span></div><div class="room">${s.code}</div><div class="stat"><span>Station integrity</span><b>${s.stationProgress}%</b></div><div class="bar"><div class="fill" style="width:${s.stationProgress}%"></div></div><div class="stat"><span>Sabotage pressure</span><b>${s.danger}%</b></div><div class="bar danger"><div class="fill" style="width:${s.danger}%"></div></div>${s.winner?`<div class="notice ${s.winner==='saboteur'?'dangerbox':''}"><b>${s.winner==='saboteur'?'SABOTEUR WINS':'OPERATORS WIN'}</b></div>`:''}`;
let c='';if(s.phase==='lobby'){c=`<h2>Waiting room</h2><p class="small">Share the room code with 1–7 other players.</p>${host?`<button onclick="act('start')" ${s.players.length<2?'disabled':''}>Start game</button>`:'<p class="notice">Waiting for the host to start…</p>'}`}
else if(s.phase==='playing'){c=`<h2 class="${me.role==='saboteur'?'role-sab':'role-op'}">${me.role==='saboteur'?'⚠ You are the Saboteur':'✦ You are an Operator'}</h2><p>${me.role==='saboteur'?'Move quietly. Break a room. Disable someone only when you share a room.':'Move around the station and repair systems before the Saboteur overwhelms the crew.'}</p><div class="stat"><span>Your location</span><b>${names[me.room]}</b></div><div class="station-map">${roomButtons(s,me)}</div>${challenge?`<div class="modal"><div class="modal-box challenge"><h2>Repair mini-game</h2><p class="small">Repeat the sequence. One mistake resets it.</p><div class="sequence">${challenge.sequence.map((x,i)=>i<challenge.step?'✓':i===challenge.step?'?':'·').join(' ')}</div><div class="symbols">${['◆','●','▲','■','✦'].map(x=>`<button class="secondary" onclick="pickSymbol('${x}')">${x}</button>`).join('')}</div></div></div>`:`<button onclick="startChallenge()" ${!me.alive?'disabled':''}>Start repair mini-game</button>`}<button class="secondary" onclick="act('meeting')" ${!me.alive?'disabled':''}>Call meeting</button>${me.role==='saboteur'?`<div class="challenge"><b>Sabotage a room</b><div>${s.rooms.map(r=>`<button class="warn" onclick="act('sabotage',{targetRoom:'${r}'})">${names[r]}</button>`).join('')}</div><button class="warn" onclick="chooseEliminate()" ${!s.canEliminate?'disabled':''}>Disable someone here</button><button class="gold" onclick="act('switch')" ${!s.canSwitch?'disabled':''}>Use Role Switch</button></div>`:''}<p class="small">${me.alive?'You are active.':'You are spectating.'}</p>`}
else if(s.phase==='meeting'){c=`<h2>Emergency meeting</h2><p class="notice">Discuss quickly. ${s.meeting.secondsLeft}s remaining.</p>${me.alive?'<p>Vote for the player you believe is the Saboteur:</p>'+s.players.filter(p=>p.alive).map(p=>`<button class="secondary" onclick="act('vote',{targetId:'${p.id}'})" ${p.id===me.id||p.voted?'disabled':''}>Vote ${esc(p.name)}${p.voted?' ✓':''}</button>`).join(''):'<p>You are spectating.</p>'}`}
else if(s.phase==='ended'){c=`<div class="modal"><div class="modal-box"><h2>${s.winner==='operators'?'OPERATORS WIN':'SABOTEUR WINS'}</h2><p>${s.winner==='operators'?'The station is secure.':'The station has been compromised.'}</p><p class="small">Choose what happens next:</p>${host?'<button onclick="act(\'rematch\')">Play again</button><button class="secondary" onclick="act(\'end\')">End game</button>':'<p class="notice">Waiting for the host to choose what happens next…</p>'}</div></div>`}$('controls').innerHTML=c;
$('players').innerHTML=s.players.map(p=>`<div class="player ${p.alive?'':'dead'}"><span>${esc(p.name)} ${p.id===me.id?'(you)':''}</span><span class="pill">${p.alive?names[p.room]:'out'}${p.voted?' · voted':''}</span></div>`).join('');$('log').innerHTML=s.events.slice().reverse().map(e=>`<div>${esc(e.text)}</div>`).join('')||'<div>No events yet.</div>'}
function chooseEliminate(){const choices=state.players.filter(p=>p.alive&&p.id!==state.you.id&&p.room===state.you.room);if(!choices.length){alert('Nobody else is in this room. Move around to find someone.');return}const n=prompt('Enter the exact player name to disable:\n'+choices.map(p=>p.name).join('\n'));const t=choices.find(p=>p.name.toLowerCase()===String(n||'').toLowerCase());if(t)act('eliminate',{targetId:t.id})}
if(room&&playerId){$('home').classList.add('hidden');$('game').classList.remove('hidden');poll()}
</script></body></html>
